name: Publish to npm

on:
  push:
    tags:
      - "v*"
    # A merge to main whose package.json version isn't on npm yet publishes it (release job below)
    branches:
      - main
  # Promote an already-published version to a dist-tag from the Actions tab
  # ("Run workflow"), instead of running `npm dist-tag add` locally.
  workflow_dispatch:
    inputs:
      version:
        description: "Published version to promote (e.g. 1.2.2)"
        required: true
        type: string
      dist_tag:
        description: "Dist-tag to point at that version"
        required: true
        type: choice
        options:
          - latest
          - beta
        default: latest

jobs:
  publish:
    name: Build and publish to npm
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag matches package.json version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "Tag ($TAG_VERSION) does not match package.json version ($PKG_VERSION)."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # Always publish under the beta dist-tag. Promote to latest with the
      # "Run workflow" button on this workflow (the promote job below).
      - name: Publish
        run: npm publish --access public --tag beta

  # A merge to main that bumps the version publishes it under beta, tags it v<version> and starts
  # that tag's sync permutation run, so a release is just a version bump in a PR. A tag made with
  # GITHUB_TOKEN starts no workflows, which is why this job publishes and starts the test itself.
  # A merge that doesn't change the version finds it already on npm and does nothing.
  release:
    name: Publish the version merged to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the v<version> tag
      actions: write # start the tag's sync permutation run
      id-token: write # npm trusted publishing
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Is this version new?
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@agility/cli@$VERSION" version >/dev/null 2>&1; then
            echo "@agility/cli@$VERSION is already on npm; nothing to publish."
            echo "new=false" >> "$GITHUB_OUTPUT"
          elif gh api "repos/$REPO/git/ref/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists; its tag push publishes it."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "Publishing @agility/cli@$VERSION."
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.version.outputs.new == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        if: steps.version.outputs.new == 'true'
        run: npm ci

      - name: Build
        if: steps.version.outputs.new == 'true'
        run: npm run build

      - name: Publish
        if: steps.version.outputs.new == 'true'
        run: npm publish --access public --tag beta

      - name: Tag v${{ steps.version.outputs.version }}
        if: steps.version.outputs.new == 'true'
        run: gh api "repos/$REPO/git/refs" -f "ref=refs/tags/v${{ steps.version.outputs.version }}" -f "sha=$GITHUB_SHA"

      - name: Start the tag's sync permutation run
        if: steps.version.outputs.new == 'true'
        run: |
          V="${{ steps.version.outputs.version }}"
          gh workflow run sync-permutation.yml --repo "$REPO" --ref "v$V" -f tier=beta -f cli_version="$V"

  promote:
    name: Promote ${{ inputs.version }} to ${{ inputs.dist_tag }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Reads the sync permutation runs for the gate below.
      actions: read
      # Uses the trusted publisher's OIDC credentials; needs "Allow npm dist-tag"
      # enabled on the package's trusted publishing configuration on npmjs.com.
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
      DIST_TAG: ${{ inputs.dist_tag }}

    steps:
      - name: Check inputs
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Run this from main (was $GITHUB_REF)."
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "'$VERSION' is not a version number."
            exit 1
          fi
          if [ "$DIST_TAG" = "latest" ] && [[ "$VERSION" == *-* ]]; then
            echo "$VERSION is a prerelease; release it as a plain version before promoting to latest."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # OIDC dist-tag support is recent; use the newest npm 11 rather than the one bundled with Node.
      - name: Update npm
        run: npm install -g npm@11

      - name: Check the version is published
        run: npm view "@agility/cli@$VERSION" version | grep -qx "$VERSION" || { echo "@agility/cli@$VERSION is not on npm."; exit 1; }

      # Nothing reaches `latest` untested on dev: the tag's sync permutation run must have passed.
      # A tag pushed by hand starts it with the push; a version merged to main gets it from the
      # release job above, as a dispatch on the tag. If it failed for a reason unrelated to the
      # CLI, re-run it from the Actions tab and promote again.
      - name: Require a passing sync permutation run
        if: env.DIST_TAG == 'latest'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          SHA=$(gh api "repos/$REPO/commits/v$VERSION" --jq .sha) || { echo "No tag v$VERSION."; exit 1; }
          PASSED=$(gh api "repos/$REPO/actions/workflows/sync-permutation.yml/runs?head_sha=$SHA&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")] | length')
          if [ "$PASSED" = "0" ]; then
            echo "No passing 'Sync permutation test' run for v$VERSION ($SHA). See the Actions tab."
            exit 1
          fi
          echo "v$VERSION passed the sync permutation test."

      - name: Promote
        run: npm dist-tag add "@agility/cli@$VERSION" "$DIST_TAG"

      - name: Show dist-tags
        run: npm view @agility/cli dist-tags
