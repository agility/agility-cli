name: Tests

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Test files are excluded from tsconfig.json and ts-jest runs transpile-only, so
      # without this step test code is never type-checked at all. That is not a cosmetic
      # gap: `for...of` over a Map compiles, under this repo's es5 target, to an
      # array-index loop that silently iterates zero times, and a test asserting on the
      # result of that loop passes while testing nothing.
      - name: Type-check (including tests)
        run: npm run type-check:tests

      - name: Run unit tests
        run: npx jest src/core src/lib --no-coverage

  sync-scenarios:
    name: Scenario tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Whole directory, not just sync-scenarios.test.ts — a new suite added under
      # src/tests/sync/ otherwise never runs in CI, which is the failure mode where the
      # tests exist, pass locally, and guard nothing.
      - name: Run sync scenarios
        run: npx jest src/tests/sync --no-coverage
